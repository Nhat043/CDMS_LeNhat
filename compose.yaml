x-app-env: &app-env
  # Local development credentials only.
  INVENTORY_DATABASE_URL: postgresql+psycopg://postgres:cdms@inventory-db:5432/inventory
  CDMS_DATABASE_URL: postgresql+psycopg://postgres:cdms@cdms-db:5432/cdms
  INVENTORY_BASE_URL: http://inventory:8001
  CDMS_BASE_URL: http://cdms:8002

x-db-health: &db-health
  test: ["CMD-SHELL", "pg_isready -U postgres"]
  interval: 2s
  timeout: 3s
  retries: 30

services:
  inventory-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: cdms
      POSTGRES_DB: inventory
    healthcheck: *db-health

  cdms-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: cdms
      POSTGRES_DB: cdms
    healthcheck: *db-health

  migrate:
    build: .
    command: alembic upgrade head
    environment: *app-env
    depends_on:
      cdms-db:
        condition: service_healthy

  inventory:
    build: .
    command: uvicorn app.inventory_main:app --host 0.0.0.0 --port 8001
    ports: ["8001:8001"]
    environment: *app-env
    depends_on:
      inventory-db:
        condition: service_healthy

  cdms:
    build: .
    command: uvicorn app.cdms_main:app --host 0.0.0.0 --port 8002
    ports: ["8002:8002"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: python -m app.worker_main
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      inventory:
        condition: service_started