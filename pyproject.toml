[project]
name = "cdms"
version = "0.1.0"
description = "Change Data Management Service: stores only changes to inventory product data"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "faker>=40.63.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
